name: Production DB Backup

# Daily logical backup of the Rasid Production database to Backblaze B2.
# READ-ONLY against Production (pg_dump + one `show server_version`). No
# migrations, tests, seeds, writes, or Staging access.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {}

# Never let two backup runs overlap; queue a new run rather than cancel a
# running one (a partial upload must never be interrupted).
concurrency:
  group: production-db-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Backup Production DB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (scripts only)
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # Official PostgreSQL APT (PGDG) setup — fully non-interactive, no gpg/tty.
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          # The runner ships a PG16 client at /usr/bin; PG17 lands in a versioned
          # dir. Pin it explicitly for all later steps — never trust PATH order.
          PG17_BINDIR=/usr/lib/postgresql/17/bin
          test -x "$PG17_BINDIR/pg_dump"    || { echo "::error::PG17 pg_dump not found at $PG17_BINDIR"; exit 1; }
          test -x "$PG17_BINDIR/pg_restore" || { echo "::error::PG17 pg_restore not found at $PG17_BINDIR"; exit 1; }
          echo "$PG17_BINDIR" >> "$GITHUB_PATH"
          echo "PG17_BINDIR=$PG17_BINDIR" >> "$GITHUB_ENV"
          # Prove the PG17 binaries by absolute path (GITHUB_PATH applies to later steps).
          "$PG17_BINDIR/pg_dump" --version
          "$PG17_BINDIR/pg_restore" --version
          case "$("$PG17_BINDIR/pg_dump" --version)" in
            *"PostgreSQL) 17."*) echo "PG17 client confirmed" ;;
            *) echo "::error::pg_dump is not PostgreSQL 17"; exit 1 ;;
          esac

      - name: Create + validate backup
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
          PROJECT_REF: sbzksiidurpofzteyxsu
          GIT_SHA: ${{ github.sha }}
          WORKDIR: ${{ runner.temp }}/backup
        run: bash scripts/backup/backup.sh

      - name: Upload artifacts to Backblaze B2
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        run: bash scripts/backup/upload.sh

      - name: Apply retention (keep 30 days, protect newest)
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          RETENTION_DAYS: "30"
        run: bash scripts/backup/retention.sh
