name: Production Backup Restore Verification

# Weekly proof that the newest Production backup is actually restorable.
# Restores into a DISPOSABLE PostgreSQL 17 service container (localhost only),
# asserts structure/RLS/migration state, then the container is torn down by
# GitHub Actions. Never connects to Production or Staging.

on:
  schedule:
    - cron: "0 4 * * 1" # 04:00 UTC every Monday
  workflow_dispatch: {}

concurrency:
  group: production-db-backup-verify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-restore:
    name: Restore newest backup into a disposable DB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout (scripts only)
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # Official PostgreSQL APT (PGDG) setup — fully non-interactive, no gpg/tty.
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          # The runner ships a PG16 client at /usr/bin; PG17 lands in a versioned
          # dir. Pin it explicitly for all later steps — never trust PATH order.
          PG17_BINDIR=/usr/lib/postgresql/17/bin
          test -x "$PG17_BINDIR/pg_dump"    || { echo "::error::PG17 pg_dump not found at $PG17_BINDIR"; exit 1; }
          test -x "$PG17_BINDIR/pg_restore" || { echo "::error::PG17 pg_restore not found at $PG17_BINDIR"; exit 1; }
          echo "$PG17_BINDIR" >> "$GITHUB_PATH"
          echo "PG17_BINDIR=$PG17_BINDIR" >> "$GITHUB_ENV"
          # Prove the PG17 binaries by absolute path (GITHUB_PATH applies to later steps).
          "$PG17_BINDIR/pg_dump" --version
          "$PG17_BINDIR/pg_restore" --version
          case "$("$PG17_BINDIR/pg_restore" --version)" in
            *"PostgreSQL) 17."*) echo "PG17 client confirmed" ;;
            *) echo "::error::pg_restore is not PostgreSQL 17"; exit 1 ;;
          esac

      - name: Download newest backup, verify checksum, restore + assert
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          VERIFY_DB_URL: postgres://postgres:postgres@localhost:5432/postgres
          WORKDIR: ${{ runner.temp }}/verify
        run: bash scripts/backup/verify-restore.sh
