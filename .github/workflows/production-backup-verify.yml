name: Production Backup Restore Verification

# Weekly proof that the newest Production backup is actually restorable.
# Restores into a DISPOSABLE PostgreSQL 17 service container (localhost only),
# asserts structure/RLS/migration state, then the container is torn down by
# GitHub Actions. Never connects to Production or Staging.

on:
  schedule:
    - cron: "0 4 * * 1" # 04:00 UTC every Monday
  workflow_dispatch: {}

concurrency:
  group: production-db-backup-verify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-restore:
    name: Restore newest backup into a disposable DB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout (scripts only)
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_restore --version

      - name: Download newest backup, verify checksum, restore + assert
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          VERIFY_DB_URL: postgres://postgres:postgres@localhost:5432/postgres
          WORKDIR: ${{ runner.temp }}/verify
        run: bash scripts/backup/verify-restore.sh
